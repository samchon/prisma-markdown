# author: elliot-huffman
name: release
permissions:
  id-token: write
  contents: write
on:
  release:
    types: [created]
defaults:
  run:
    shell: pwsh
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance
